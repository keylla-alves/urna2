
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - CPF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="urna">
    <h1>URNA ELETRÔNICA</h1>

    <div class="visor">
        <h2>IDENTIFICAÇÃO DO ELEITOR</h2>
        <p>Digite seu CPF para iniciar a votação.</p>

        <input type="text" id="cpf"
            placeholder="000.000.000-00"
            readonly>

        <p id="mensagem">Digite os 11 números do seu CPF.</p>
    </div>

    <div class="teclado">
        <div class="numeros">
            <button onclick="digitar(1)">1</button>
            <button onclick="digitar(2)">2</button>
            <button onclick="digitar(3)">3</button>
            <button onclick="digitar(4)">4</button>
            <button onclick="digitar(5)">5</button>
            <button onclick="digitar(6)">6</button>
            <button onclick="digitar(7)">7</button>
            <button onclick="digitar(8)">8</button>
            <button onclick="digitar(9)">9</button>
            <button class="zero" onclick="digitar(0)">0</button>
        </div>

        <div class="acoes">
            <button class="corrige" onclick="corrigir()">CORRIGE</button>
            <button class="limpa" onclick="limpar()">LIMPA</button>
            <button class="confirma" onclick="confirmar()">CONFIRMA</button>
        </div>
    </div>
</div>

<script src="ke.js"></script>
</body>
</html>
